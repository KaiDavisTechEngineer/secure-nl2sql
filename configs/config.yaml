# configs/config.yaml

project:
  name: "secure-nl2sql"
  version: "1.0.0"

# --- DATA ---
data:
  # Spider = Yale's NL-to-SQL benchmark dataset
  # 10,000+ natural language / SQL pairs across 200 databases
  # Industry standard for evaluating NL-to-SQL models
  spider_url: "https://huggingface.co/datasets/spider"
  wikisql_url: "https://huggingface.co/datasets/wikisql"
  max_samples: 10000
  train_split: 0.85
  val_split: 0.10
  test_split: 0.05
  max_input_length: 512
  max_target_length: 256
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  dataset_dir: "data/datasets"

# --- MODEL ---
model:
  # SQLCoder is specifically fine-tuned for SQL generation
  # Much better starting point than a general LLM for this task
  base_model_name: "defog/sqlcoder-7b-2"
  base_model_dir: "models/base"
  finetuned_model_dir: "models/finetuned"
  checkpoint_dir: "models/checkpoints"

# --- LORA ---
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"

# --- TRAINING ---
training:
  output_dir: "models/checkpoints"
  num_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  save_steps: 100
  eval_steps: 100
  logging_steps: 25
  fp16: true
  load_best_model_at_end: true

# --- SECURITY SCANNER ---
security:
  # Risk score: 0-10 (10 = most dangerous)
  # These thresholds determine what gets flagged
  critical_threshold: 8
  high_threshold: 6
  medium_threshold: 4
  low_threshold: 2

  # Columns that should NEVER appear in generated queries
  sensitive_columns:
    - "password"
    - "passwd"
    - "pwd"
    - "secret"
    - "token"
    - "api_key"
    - "ssn"
    - "social_security"
    - "credit_card"
    - "card_number"
    - "cvv"
    - "private_key"
    - "auth_token"
    - "access_token"

  # SQL operations that should trigger immediate review
  destructive_operations:
    - "DROP"
    - "TRUNCATE"
    - "DELETE"
    - "ALTER"
    - "CREATE"
    - "GRANT"
    - "REVOKE"

# --- MLFLOW ---
mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "secure-nl2sql"

# --- API ---
api:
  host: "0.0.0.0"
  port: 8000
  max_new_tokens: 256
  temperature: 0.1      # Very low — SQL needs to be precise, not creative
  top_p: 0.95
  max_question_length: 500

# --- MONITORING ---
monitoring:
  reference_data_path: "data/processed/reference.csv"
  drift_threshold: 0.15
  alert_on_critical_security: true